[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se-dat"
version = "0.1.2"
description = "Simple Exploratory Data Analysis tool: column profiling, correlation analysis, and encoding suggestions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Haim Feldman", email = "haimfeld@gmail.com" }]
keywords = ["eda", "data-analysis", "pandas", "correlation", "encoding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "pre-commit", "ruff", "isort"]
sklearn = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.isort]
profile = "black"
known_first_party = ["sedat"]
